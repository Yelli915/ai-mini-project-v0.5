# ──────────────────────────────────────────────────────────────
# 분석 아이템 설정
#  - competitors : 아이템별 분석 대상 기업 (강사가 아이템에 맞게 지정)
#  - test_questions : Day 1 진단용 테스트 질문 3개
#      q1 = 단일 사실 확인형 / q2 = 경쟁사 비교형 / q3 = 기본 자료만으로는 부족한 최신 정보형
# ──────────────────────────────────────────────────────────────
items:
  custom_hbm:
    name: "Custom HBM (HBM4E 베이스 다이)"
    competitors: ["SK hynix", "Samsung", "TSMC"]
    test_questions:
      q1: "Custom HBM에서 베이스 다이는 어떤 역할을 하나요?"
      q2: "SK hynix, Samsung, TSMC의 Custom HBM 베이스 다이 전략과 기술 성숙도(TRL)를 비교해 주세요."
      q3: "최근 3개월 사이 HBM4E 베이스 다이 파운드리 선택과 관련해 새로 발표된 내용이 있나요?"
  hbf:
    name: "HBF (High Bandwidth Flash)"
    competitors: ["SK hynix", "SanDisk", "Samsung"]   # Samsung의 HBF 관련 입장은 출제 전 확인 필요
    test_questions:
      q1: "HBF는 HBM과 무엇이 다른가요?"
      q2: "SK hynix, SanDisk, Samsung의 HBF 개발 현황과 기술 성숙도(TRL)를 비교해 주세요."
      q3: "HBF 표준 사양 공개 이후 새로 발표된 샘플 출하나 고객사 소식이 있나요?"
  hybrid_bonding:
    name: "Hybrid Bonding (HBM 적층 공정)"
    competitors: ["SK hynix", "Samsung", "TSMC"]
    test_questions:
      q1: "Hybrid Bonding은 기존 TC 본딩과 무엇이 다른가요?"
      q2: "SK hynix, Samsung, TSMC의 Hybrid Bonding 적용 계획과 기술 성숙도(TRL)를 비교해 주세요."
      q3: "HBM에 Hybrid Bonding을 적용하는 시점에 대한 최근 전망은 어떻게 바뀌었나요?"
  socamm2:
    name: "SOCAMM2 (LPDDR 기반 서버 메모리 모듈)"
    competitors: ["SK hynix", "Samsung", "Micron"]
    test_questions:
      q1: "SOCAMM2는 기존 서버용 DDR5 모듈과 무엇이 다른가요?"
      q2: "SK hynix, Samsung, Micron의 SOCAMM2 양산 현황과 기술 성숙도(TRL)를 비교해 주세요."
      q3: "최근 SOCAMM2를 채택한 신규 고객사나 플랫폼 소식이 있나요?"
